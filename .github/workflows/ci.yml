name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    env:
      # The config refuses to build without a signing secret (ADR-0015). CI
      # signs nothing real, so a throwaway value is correct here.
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      DATABASE_URI: 'file:./iso-kms.db'
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`. A runtime upgrade changes behaviour the tests
      # depend on — Bun 1.4 changed what assigning `undefined` to a
      # `process.env` key does — and that should arrive as a reviewed diff.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
